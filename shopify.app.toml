# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "72f82a63b0e306e2138f3fcc90cdd779"
name = "Slidez AI Try-On"
application_url = "https://slidez-virtual-tryon.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://slidez-virtual-tryon.vercel.app/api/webhooks"

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [ "https://slidez-virtual-tryon.vercel.app/auth/callback" ]

[app_proxy]
url = "https://slidez-virtual-tryon.vercel.app/api/product-check"
subpath = "try-on"
prefix = "apps"

